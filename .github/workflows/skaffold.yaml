name: Skaffold
permissions:
  contents: read
"on":
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
        description: Whether to push images during build
    secrets:
      OPERATOR_PRIVATE_KEY:
        required: true
  workflow_dispatch: {}
jobs:
  build-render:
    name: Build & Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-labs/actions/nix/setup@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
      - id: skaffold
        uses: shikanime-labs/actions/skaffold/integration@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          push: ${{ inputs.push }}
      - name: Save manifest
        run:
          "mkdir -p artifacts\ncat > artifacts/skaffold-manifest.yaml
          <<'MANIFEST_EOF'\n$SKAFFOLD_MANIFEST\nMANIFEST_EOF\n"
        shell: bash
        env:
          SKAFFOLD_MANIFEST: ${{ steps.skaffold.outputs.manifest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skaffold-manifest
          path: artifacts/skaffold-manifest.yaml
  build-render-profile:
    name: Build & Render (Profile)
    if: ${{ needs['setup-profiles-jobs'].outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - setup-profiles-jobs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs['setup-profiles-jobs'].outputs.matrix) }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - uses: shikanime-labs/actions/nix/setup@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: direnv
        uses: shikanime-labs/actions/direnv@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
      - uses: shikanime-labs/actions/skaffold/integration@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          profile: ${{ matrix.name }}
          push: ${{ inputs.push }}
  setup-profiles-jobs:
    name: Setup Profiles Jobs
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.setup-profiles-jobs.outputs.continue }}
      matrix: ${{ steps.setup-profiles-jobs.outputs.matrix }}
    steps:
      - id: createGithubAppToken
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.OPERATOR_APP_CLIENT_ID }}
          permission-contents: read
          private-key: ${{ secrets.OPERATOR_PRIVATE_KEY }}
      - uses: shikanime-labs/actions/checkout@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - uses: shikanime-labs/actions/nix/setup@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
        with:
          github-token:
            ${{ steps.createGithubAppToken.outputs.token || secrets.GITHUB_TOKEN
            }}
      - id: setup-profiles-jobs
        uses: shikanime-labs/actions/skaffold/setup-profiles-jobs@a91a9b57c78121e303aa30aea2d8ed2ee03ff45f # v9
